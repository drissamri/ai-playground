# Deploy main to the dev AWS account, after the owner approves the run in environment
# `dev`. See docs/deploy.md.
#
#   build   no AWS access: Gradle and `cdk synth` (app and dependency code runs here)
#   deploy  environment dev, OIDC: only the CDK CLI, deploying the synthesized cdk.out
#
# With id-token: write, every step of a job can request an OIDC token, so code we
# build never runs in the job that has that permission.
# AWS side: role github-ai-playground-deploy in the aws-foundation repo. It only works
# for environment `dev` on main, and everything CDK deploys is capped by the
# cdk-deploy-boundary policy.
# Human-owned: agents do not edit .github/workflows/ (AGENTS.md).
name: deploy

on:
  push:
    branches: [main]
    paths: [infra/**, lambdas/**, .github/workflows/deploy.yml]
  workflow_dispatch: # redeploy main by hand

permissions: {}

jobs:
  build:
    name: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    concurrency:
      group: deploy-build
      cancel-in-progress: true # only the latest commit on main deploys anyway
    permissions:
      contents: read
    outputs:
      infra: ${{ steps.infra.outputs.present }}
    env:
      CDK_DISABLE_CLI_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No CDK app yet (#5): nothing to deploy, and no approval request.
      - id: infra
        run: |
          if [[ -d infra ]]; then echo "present=true"; else echo "present=false"; fi >> "$GITHUB_OUTPUT"

      # No caches anywhere in this workflow: what it deploys is built from scratch.
      - if: hashFiles('lambdas/**') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: "25"

      - if: hashFiles('lambdas/**') != ''
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-disabled: true

      # Tests ran in CI; here only the Lambda package.
      - if: hashFiles('lambdas/**') != ''
        working-directory: lambdas
        run: ./gradlew assemble

      - if: steps.infra.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - if: steps.infra.outputs.present == 'true'
        working-directory: infra
        run: |
          npm ci --ignore-scripts
          npx --no-install cdk synth --quiet --no-notices

      - if: steps.infra.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cdk-out
          path: infra/cdk.out
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: deploy
    needs: build
    if: needs.build.outputs.infra == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false # never stop a deploy halfway
    permissions:
      contents: read
      id-token: write # GitHub OIDC token for AWS
    env:
      CDK_DISABLE_CLI_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # An approval is for this commit. If main has moved on (a later merge, or a
      # re-run of an old run), stop: the newer run deploys.
      - name: Still the latest commit on main
        run: |
          latest=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
          if [[ "$latest" != "$GITHUB_SHA" ]]; then
            echo "::error::main is at ${latest}, not ${GITHUB_SHA}: not deploying an older commit"
            exit 1
          fi

      # Only the CDK CLI from the lockfile, without install scripts. It deploys the
      # downloaded cdk.out (--app), so no app code runs in this job.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false

      - working-directory: infra
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cdk-out
          path: infra/cdk.out

      # mask-aws-account-id masks the account ID in the logs. The logs of this public
      # repo are public: never put secrets in stack outputs.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: ai-playground-deploy-${{ github.run_id }}
          mask-aws-account-id: true

      # No interactive approval in CI: the change was reviewed in the PR, and the run
      # was approved in environment `dev`.
      - working-directory: infra
        run: npx --no-install cdk deploy --app cdk.out "AiPlayground*" --require-approval never --no-notices
