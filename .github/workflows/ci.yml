# Build and test on every pull request and on main. No AWS credentials.
# One job: the CDK app (infra/) packages the Lambda build output (lambdas/).
# Each part runs once its folder exists (lambdas/ from #6, infra/ from #5). Gated on
# the folder, not a file in it: deleting gradlew or package-lock.json fails the build.
# Human-owned: agents do not edit .github/workflows/ (AGENTS.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CDK_DISABLE_CLI_TELEMETRY: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # --- lambdas/: Quarkus on Gradle ---

      # Corretto: the JDK of the Lambda java25 runtime and of the devbox.
      - if: hashFiles('lambdas/**') != ''
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: corretto
          java-version: "25"

      # Also validates the Gradle wrapper checksum. Open-source cache; only main writes it.
      - if: hashFiles('lambdas/**') != ''
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - if: hashFiles('lambdas/**') != ''
        working-directory: lambdas
        run: ./gradlew build

      # --- infra/: CDK TypeScript ---

      - if: hashFiles('infra/**') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      # No install scripts, as on the devbox.
      - if: hashFiles('infra/**') != ''
        working-directory: infra
        run: npm ci --ignore-scripts

      - if: hashFiles('infra/**') != ''
        working-directory: infra
        run: npm test

      # --no-install: never fetch an unpinned cdk from the registry.
      - if: hashFiles('infra/**') != ''
        working-directory: infra
        run: npx --no-install cdk synth --quiet --no-notices
